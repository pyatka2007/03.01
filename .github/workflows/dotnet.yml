name: .NET Framework CI

on:
  push:
    branches: [ "main", "ПР6", "PR6" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ConsoleApp46.sln

    - name: Build solution
      run: msbuild ConsoleApp46.sln /p:Configuration=Release

    - name: Run tests
      run: vstest.console.exe ConsoleApp46.Tests\bin\Release\ConsoleApp46.Tests.dll